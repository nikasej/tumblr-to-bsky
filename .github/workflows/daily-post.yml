name: daily-bluesky-post

on:
  schedule:
    - cron: "17 * * * *"   # checks hourly: one Day post a day at a varying peak hour, extras earlier
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, ignoring today's time slot"
        type: boolean
        default: false

permissions:
  contents: write           # needed to save posted.json back to the repo

concurrency: repo-writes

env:
  POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY }}   # Day posts per day, default 1

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is it time?
        id: due
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "action=auto" >> "$GITHUB_OUTPUT"
          elif action=$(python3 tumblr_to_bsky.py due); then
            echo "action=$action" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.action != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.due.outputs.action != ''
        run: pip install requests atproto==0.0.73 pillow opencv-python-headless numpy
      - if: steps.due.outputs.action != ''
        run: python tumblr_to_bsky.py post ${{ steps.due.outputs.action }}
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - if: steps.due.outputs.action != ''
        name: Save progress
        run: |
          git config user.name "bsky-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json last_post.json bsky_posts.json
          git diff --cached --quiet || (git commit -m "update posted.json" && git push)
