name: daily-bluesky-post

on:
  schedule:
    - cron: "17 * * * *"   # checks hourly; posts once a day at a varying peak hour
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, ignoring today's time slot"
        type: boolean
        default: false

permissions:
  contents: write           # needed to save posted.json back to the repo

concurrency: repo-writes

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is it time?
        id: due
        run: |
          if [ "${{ inputs.force }}" = "true" ] || python3 tumblr_to_bsky.py due; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.due.outputs.go == 'true'
        run: pip install requests atproto pillow opencv-python-headless numpy
      - if: steps.due.outputs.go == 'true'
        run: python tumblr_to_bsky.py post
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - if: steps.due.outputs.go == 'true'
        name: Save progress
        run: |
          git config user.name "bsky-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json last_post.json
          git diff --cached --quiet || (git commit -m "update posted.json" && git push)
