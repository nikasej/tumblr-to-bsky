name: daily-bluesky-post

on:
  schedule:
    - cron: "0 16 * * *"   # every day 16:00 UTC; change to taste
  workflow_dispatch:        # lets you trigger it manually to test

permissions:
  contents: write           # needed to save posted.json back to the repo

concurrency: repo-writes

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests atproto pillow
      - run: git pull --ff-only
      - run: python tumblr_to_bsky.py post
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - name: Save progress
        run: |
          git config user.name "bsky-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "update posted.json" && git push)
