name: export-tumblr

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 3 * * 1"     # also every Monday 03:00 UTC to pick up new Tumblr posts

permissions:
  contents: write

concurrency: repo-writes

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tumblr_to_bsky.py export
        env:
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY }}
      - name: Save archive
        run: |
          git config user.name "bsky-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || (git commit -m "update tumblr archive" && git push)
